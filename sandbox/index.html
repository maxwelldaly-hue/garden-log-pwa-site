<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark"><title>Moved</title>
<style>body{background:#080d18;color:#e8eef8;font:16px/1.6 system-ui,sans-serif;margin:0;
display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px}
a{color:#8fd0a0}</style></head><body><div>
<p>The garden has moved.</p>
<p><a id="go" href="https://dadsgarden-demo.fly.dev/">dadsgarden-demo.fly.dev</a></p>
<p style="opacity:.7;font-size:14px">If you added it to your home screen, that icon points here —
 open the link above and add it again from there.</p>
</div><script>
(function(){try{if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations()
.then(function(rs){rs.forEach(function(r){r.unregister();});});}
if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}}catch(e){}
setTimeout(function(){location.replace("https://dadsgarden-demo.fly.dev/");},400);})();
</script></body></html>
